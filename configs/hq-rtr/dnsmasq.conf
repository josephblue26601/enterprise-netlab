# DHCP only (port=0 disables the DNS function here; hq-srv1 is the DNS server)
port=0
log-dhcp
interface=eth3.10
interface=eth3.30
interface=eth3.99
dhcp-range=set:users,10.10.10.100,10.10.10.200,255.255.255.0,12h
dhcp-range=set:guest,10.10.30.100,10.10.30.200,255.255.255.0,2h
dhcp-range=set:mgmt,10.10.99.100,10.10.99.150,255.255.255.0,12h
dhcp-option=tag:users,option:router,10.10.10.1
dhcp-option=tag:guest,option:router,10.10.30.1
dhcp-option=tag:mgmt,option:router,10.10.99.1
dhcp-option=option:dns-server,10.10.20.10
dhcp-option=option:domain-name,lab.internal

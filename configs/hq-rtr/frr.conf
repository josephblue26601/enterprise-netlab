frr defaults traditional
hostname hq-rtr
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description WAN-to-ISP
 ip address 203.0.113.2/30
!
interface eth2
 description WAN-PRIMARY-to-br-rtr
 ip address 10.255.0.1/30
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
!
interface eth4
 description WAN-BACKUP-to-br-rtr
 ip address 10.255.0.5/30
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf bfd
!
interface eth3.10
 description VLAN10-USERS
 ip address 10.10.10.1/24
!
interface eth3.20
 description VLAN20-SERVERS
 ip address 10.10.20.1/24
!
interface eth3.30
 description VLAN30-GUEST
 ip address 10.10.30.1/24
!
interface eth3.99
 description VLAN99-MGMT
 ip address 10.10.99.1/24
!
router ospf
 ospf router-id 10.0.0.1
 passive-interface default
 no passive-interface eth2
 no passive-interface eth4
 network 10.0.0.1/32 area 0
 network 10.255.0.0/30 area 0
 network 10.255.0.4/30 area 0
 network 10.10.0.0/16 area 0
 default-information originate
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 203.0.113.1 remote-as 65000
 neighbor 203.0.113.1 description ISP-UPSTREAM
 !
 address-family ipv4 unicast
  neighbor 203.0.113.1 prefix-list FROM-ISP in
  neighbor 203.0.113.1 prefix-list TO-ISP out
 exit-address-family
!
! Never leak RFC1918 to the ISP; NAT hides internal space behind 203.0.113.2
ip prefix-list TO-ISP seq 5 deny any
ip prefix-list FROM-ISP seq 5 permit 0.0.0.0/0
ip prefix-list FROM-ISP seq 10 permit 198.51.100.0/24
ip prefix-list FROM-ISP seq 15 permit 8.8.8.8/32
!
bfd
!
line vty
!

# Internal DNS for lab.internal; forwards everything else to the "internet" resolver
no-resolv
no-dhcp-interface=eth1
listen-address=10.10.20.10
bind-interfaces
domain=lab.internal
local=/lab.internal/
log-queries

address=/hq-rtr.lab.internal/10.0.0.1
address=/br-rtr.lab.internal/10.0.0.2
address=/hq-srv1.lab.internal/10.10.20.10
address=/isp.lab.internal/203.0.113.1
address=/intranet.lab.internal/10.10.20.10

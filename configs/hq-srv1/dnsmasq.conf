# Internal DNS for lab.internal; forwards everything else to the "internet" resolver
no-resolv
no-dhcp-interface=eth1
listen-address=10.10.20.10
bind-interfaces
domain=lab.internal
local=/lab.internal/
log-queries

host-record=hq-rtr.lab.internal,10.0.0.1
host-record=br-rtr.lab.internal,10.0.0.2
host-record=hq-srv1.lab.internal,10.10.20.10
host-record=isp.lab.internal,203.0.113.1
host-record=intranet.lab.internal,10.10.20.10

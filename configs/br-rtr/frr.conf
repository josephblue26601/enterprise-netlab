frr defaults traditional
hostname br-rtr
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description WAN-PRIMARY-to-hq-rtr
 ip address 10.255.0.2/30
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
!
interface eth3
 description WAN-BACKUP-to-hq-rtr
 ip address 10.255.0.6/30
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf bfd
!
interface eth2.10
 description VLAN10-USERS
 ip address 10.20.10.1/24
!
interface eth2.30
 description VLAN30-GUEST
 ip address 10.20.30.1/24
!
interface eth2.99
 description VLAN99-MGMT
 ip address 10.20.99.1/24
!
router ospf
 ospf router-id 10.0.0.2
 passive-interface default
 no passive-interface eth1
 no passive-interface eth3
 network 10.0.0.2/32 area 0
 network 10.255.0.0/30 area 0
 network 10.255.0.4/30 area 0
 network 10.20.0.0/16 area 0
!
bfd
!
line vty
!
